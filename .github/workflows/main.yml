name: Build RankCounter31

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyinstaller pillow
      - name: Build Windows exe
        shell: cmd
        run: |
          cd "clanlord apps/RankCounter/RankCounter31"
          pyinstaller --noconfirm --onefile --windowed --name RankCounter ^
            --add-data "rankmessages.txt;." ^
            --add-data "trainers.txt;." ^
            --add-data "specialphrases.txt;." ^
            --add-data "KIN668.TTF;." ^
            --add-data "phoenix.png;." ^
            --add-data "img;img" ^
            --add-data "Bestiary_2026_07_06_Dump.xml;." ^
            --add-data "weapons_data.json;." ^
            --add-data "offhand_data.json;." ^
            --add-data "shoulder_data.json;." ^
            --add-data "armor_data.json;." ^
            --add-data "bestiary_levels.json;." ^
            main.py
      - uses: actions/upload-artifact@v4
        with:
          name: RankCounter-windows
          path: clanlord apps/RankCounter/RankCounter31/dist/RankCounter.exe
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: clanlord apps/RankCounter/RankCounter31/dist/RankCounter.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyinstaller pillow
      - name: Build macOS app
        run: |
          cd "clanlord apps/RankCounter/RankCounter31"
          pyinstaller --noconfirm --windowed --name RankCounter \
            --add-data "rankmessages.txt:." \
            --add-data "trainers.txt:." \
            --add-data "specialphrases.txt:." \
            --add-data "KIN668.TTF:." \
            --add-data "phoenix.png:." \
            --add-data "img:img" \
            --add-data "Bestiary_2026_07_06_Dump.xml:." \
            --add-data "weapons_data.json:." \
            --add-data "offhand_data.json:." \
            --add-data "shoulder_data.json:." \
            --add-data "armor_data.json:." \
            --add-data "bestiary_levels.json;." \
            main.py
      - uses: actions/upload-artifact@v4
        with:
          name: RankCounter-macos
          path: clanlord apps/RankCounter/RankCounter31/dist/RankCounter.app
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: clanlord apps/RankCounter/RankCounter31/dist/RankCounter.app/**/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk wget
      - name: Install Python dependencies
        run: pip install pyinstaller pillow
      - name: Build Linux binary
        run: |
          cd "clanlord apps/RankCounter/RankCounter31"
          pyinstaller --noconfirm --onefile --name RankCounter \
            --add-data "rankmessages.txt:." \
            --add-data "trainers.txt:." \
            --add-data "specialphrases.txt:." \
            --add-data "KIN668.TTF:." \
            --add-data "phoenix.png:." \
            --add-data "img:img" \
            --add-data "Bestiary_2026_07_06_Dump.xml:." \
            --add-data "weapons_data.json:." \
            --add-data "offhand_data.json:." \
            --add-data "shoulder_data.json:." \
            --add-data "armor_data.json:." \
            --add-data "bestiary_levels.json;." \
            main.py
      - name: Prepare AppDir
        run: |
          cd "clanlord apps/RankCounter/RankCounter31"
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp dist/RankCounter AppDir/usr/bin/
          ln -s usr/bin/RankCounter AppDir/AppRun
          cat > AppDir/RankCounter.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=RankCounter
          Exec=RankCounter
          Icon=RankCounter
          Categories=Utility;
          EOF
          cp phoenix.png AppDir/RankCounter.png
      - name: Download appimagetool
        run: |
          cd "clanlord apps/RankCounter/RankCounter31"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build AppImage
        run: |
          cd "clanlord apps/RankCounter/RankCounter31"
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir RankCounter-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: RankCounter-linux
          path: clanlord apps/RankCounter/RankCounter31/RankCounter-x86_64.AppImage
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: clanlord apps/RankCounter/RankCounter31/RankCounter-x86_64.AppImage
